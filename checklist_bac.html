    .tabs {

      background: #e2e8f0;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      flex: 1;

      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      background: transparent;
      color: #64748b;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
    }
    .tab-btn.active-maths { background: #fff; color: #6366f1; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .tab-btn.active-pc    { background: #fff; color: #0891b2; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

    .panel { background: #fff; border-radius: 16px; padding: 1.5rem; box-shadow: 0 1px 6px rgba(0,0,0,0.06); }
    .panel.hidden { display: none; }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .panel-title { font-size: 1.2rem; font-weight: 800; }

    .panel-title.pc    { color: #0891b2; }
    .panel-stats { font-size: 0.8rem; color: #64748b; margin-top: 0.15rem; }

      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      cursor: pointer;
      color: #64748b;
      flex-shrink: 0;

    .reset-btn:hover { background: #fee2e2; color: #b91c1c; border-color: #fca5a5; }

      height: 8px;
      border-radius: 4px;
      background: #e2e8f0;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      border-radius: 4px;
      width: 0%;
      transition: width 0.4s;
    }
    .progress-bar.maths { background: #6366f1; }
    .progress-bar.pc    { background: #0891b2; }

    /* Theme sections */
    .theme-section { margin-bottom: 1.4rem; }

    .theme-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.35rem;
      gap: 0.5rem;
    }
    .theme-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: #1e293b;
      flex: 1;
    }
    .theme-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e2e8f0;
      color: #475569;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .theme-badge.complete { background: #bbf7d0; color: #166534; }

    .theme-progress-wrap {
      height: 4px;
      border-radius: 2px;
      background: #e2e8f0;
      margin-bottom: 0.5rem;
      overflow: hidden;
    }
    .theme-progress-bar {
      height: 100%;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s;
      background: #6366f1;
    }
    .theme-progress-bar.done { background: #22c55e; }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;

    .item.checked { background: #f0fdf4; }

      margin-top: 2px;
      accent-color: #22c55e;
      cursor: pointer;
      flex-shrink: 0;
      width: 16px;
      height: 16px;
    }

      font-size: 0.875rem;
      color: #334155;
      line-height: 1.5;
      user-select: none;
    }

      color: #15803d;
      text-decoration: line-through;
    }

</head>

  /* ── STORAGE ──────────────────────────────────────────────────────── */
  const STORAGE_KEY = "bac_checklist_v2";

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      if (typeof parsed !== "object" || parsed === null || Array.isArray(parsed)) return {};
      return parsed;
    } catch (_) {
      return {};
    }
  }

  function saveState(state) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (_) { /* storage full or unavailable — silently ignore */ }
  }

  /* ── STATE ────────────────────────────────────────────────────────── */
  const globalState = loadState();
  if (!globalState.Mathématiques) globalState.Mathématiques = {};
  if (!globalState["Physique-Chimie"]) globalState["Physique-Chimie"] = {};

  /* ── RENDER HELPERS ───────────────────────────────────────────────── */
  function escapeText(str) {
    const div = document.createElement("div");
    div.appendChild(document.createTextNode(str));
    return div.innerHTML;
  }

  function buildPanel(subjectKey, data, containerId, statsId, barId) {
    const container = document.getElementById(containerId);
    const statsEl   = document.getElementById(statsId);
    const barEl     = document.getElementById(barId);
    const checks    = globalState[subjectKey];

    /* total competences */
    let grandTotal = 0;
    data.forEach(function(t) { grandTotal += t.items.length; });

    function countDone() {
      return Object.values(checks).filter(Boolean).length;
    }

    function updateGlobalBar() {
      const done = countDone();
      const pct  = grandTotal === 0 ? 0 : Math.round((done / grandTotal) * 100);
      statsEl.textContent = done + " / " + grandTotal + " compétences maîtrisées — " + pct + "%";
      barEl.style.width   = pct + "%";
    }

    data.forEach(function(section, ti) {
      const total = section.items.length;

      /* section wrapper */
      const sectionEl = document.createElement("div");
      sectionEl.className = "theme-section";

      /* header */
      const header = document.createElement("div");
      header.className = "theme-header";

      const titleEl = document.createElement("div");
      titleEl.className = "theme-title";
      titleEl.textContent = section.theme;

      const badge = document.createElement("span");
      badge.className = "theme-badge";

      header.appendChild(titleEl);
      header.appendChild(badge);
      sectionEl.appendChild(header);

      /* theme progress bar */
      const themeWrap = document.createElement("div");
      themeWrap.className = "theme-progress-wrap";
      const themeBar = document.createElement("div");
      themeBar.className = "theme-progress-bar";
      themeWrap.appendChild(themeBar);
      sectionEl.appendChild(themeWrap);

      function updateTheme() {
        let done = 0;
        for (let i = 0; i < total; i++) {
          if (checks[ti + "_" + i]) done++;
        }
        const pct = total === 0 ? 0 : Math.round((done / total) * 100);
        badge.textContent = done + "/" + total;
        badge.className   = "theme-badge" + (pct === 100 ? " complete" : "");
        themeBar.style.width = pct + "%";
        themeBar.className   = "theme-progress-bar" + (pct === 100 ? " done" : "");
      }

      /* items list */
      const ul = document.createElement("ul");
      ul.className = "items";

      section.items.forEach(function(text, i) {
        const key = ti + "_" + i;

        const li = document.createElement("li");
        li.className = "item" + (checks[key] ? " checked" : "");

        const cb = document.createElement("input");
        cb.type    = "checkbox";
        cb.checked = !!checks[key];

        const label = document.createElement("span");
        label.className = "item-label";
        label.textContent = text;

        li.appendChild(cb);
        li.appendChild(label);

        function toggle() {
          checks[key] = !checks[key];
          cb.checked = checks[key];
          li.className = "item" + (checks[key] ? " checked" : "");
          globalState[subjectKey] = checks;
          saveState(globalState);
          updateTheme();
          updateGlobalBar();
        }

        /* click on row toggles checkbox */
        li.addEventListener("click", function(e) {
          /* avoid double-firing when clicking directly on the checkbox */
          if (e.target !== cb) {
            toggle();
          }
        });
        cb.addEventListener("change", toggle);

        ul.appendChild(li);
      });

      sectionEl.appendChild(ul);

      /* separator between themes */
      if (ti < data.length - 1) {
        const hr = document.createElement("hr");
        hr.className = "sep";
        sectionEl.appendChild(hr);
      }

      container.appendChild(sectionEl);
      updateTheme();
    });

    updateGlobalBar();
  }

  /* ── RESET ────────────────────────────────────────────────────────── */
  function wireReset(btnId, subjectKey, containerId, statsId, barId) {
    document.getElementById(btnId).addEventListener("click", function() {
      if (!confirm("Réinitialiser toute la progression pour cette matière ?")) return;
      globalState[subjectKey] = {};
      saveState(globalState);
      /* Rebuild the panel from scratch */
      document.getElementById(containerId).innerHTML = "";
      const dataset = subjectKey === "Mathématiques" ? MATHS : PHYSIQUE;
      buildPanel(subjectKey, dataset, containerId, statsId, barId);
    });
  }

  /* ── TABS ─────────────────────────────────────────────────────────── */
  const btnMaths = document.getElementById("btn-maths");
  const btnPc    = document.getElementById("btn-pc");
  const panelM   = document.getElementById("panel-maths");
  const panelP   = document.getElementById("panel-pc");

  function showMaths() {
    panelM.classList.remove("hidden");
    panelP.classList.add("hidden");
    btnMaths.className = "tab-btn active-maths";
    btnPc.className    = "tab-btn";
  }
  function showPc() {
    panelP.classList.remove("hidden");
    panelM.classList.add("hidden");
    btnPc.className    = "tab-btn active-pc";
    btnMaths.className = "tab-btn";
  }

  btnMaths.addEventListener("click", showMaths);
  btnPc.addEventListener("click", showPc);

  /* ── INIT ─────────────────────────────────────────────────────────── */
  buildPanel("Mathématiques",   MATHS,   "content-maths", "stats-maths", "bar-maths");
  buildPanel("Physique-Chimie", PHYSIQUE, "content-pc",   "stats-pc",    "bar-pc");

  wireReset("reset-maths", "Mathématiques",   "content-maths", "stats-maths", "bar-maths");
  wireReset("reset-pc",    "Physique-Chimie", "content-pc",    "stats-pc",    "bar-pc");

})();
</script>
